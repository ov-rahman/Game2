<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="color-scheme" content="dark">
<title>ГЛУБИНА — спуск на пять этажей</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="stage">
  <canvas id="game" tabindex="0" aria-label="Игровое поле"></canvas>
  <div id="boot">
    <div class="boot-title">ГЛУБИНА</div>
    <div class="boot-sub">генерируем текстуры…</div>
  </div>
  <noscript><p class="fatal">Для игры нужен включённый JavaScript.</p></noscript>
</div>

<script type="module">
  import { boot } from './src/main.js';

  const canvas = document.getElementById('game');
  const splash = document.getElementById('boot');

  function fail(message, detail) {
    splash.classList.remove('hidden');
    splash.innerHTML =
      '<div class="boot-title">не удалось запустить</div>' +
      '<div class="boot-sub">' + message + '</div>' +
      (detail ? '<pre class="boot-detail">' + String(detail).slice(0, 600) + '</pre>' : '');
  }

  // ES modules cannot load over file:// — browsers apply CORS to module
  // scripts — so the page needs any static server in front of it.
  if (location.protocol === 'file:') {
    fail(
      'Браузер блокирует ES-модули на file://. Запусти локальный сервер ' +
      'в папке игры и открой http://localhost:8000/ — например: ' +
      'python3 -m http.server 8000',
    );
  } else {
    try {
      const app = boot(canvas);
      splash.classList.add('hidden');
      canvas.focus();
      window.__DEEPSHADE__ = app;
    } catch (err) {
      fail('ошибка инициализации', err && err.stack ? err.stack : err);
      throw err;
    }
  }
</script>
</body>
</html>
