<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="color-scheme" content="dark">
<title>Глубина — спуск в пять этажей</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="stage">
  <canvas id="game" width="640" height="384" tabindex="0" aria-label="Игровое поле"></canvas>
  <div id="boot">
    <div class="boot-title">ГЛУБИНА</div>
    <div class="boot-sub">рисуем спрайты…</div>
  </div>
  <noscript><p class="fatal">Для игры нужен включённый JavaScript.</p></noscript>
</div>

<script type="module">
  import { boot } from './src/main.js';

  const canvas = document.getElementById('game');
  const splash = document.getElementById('boot');

  function fail(message, detail) {
    splash.classList.remove('hidden');
    splash.innerHTML =
      '<div class="boot-title">не удалось запустить</div>' +
      '<div class="boot-sub">' + message + '</div>' +
      (detail ? '<pre class="boot-detail">' + String(detail).slice(0, 400) + '</pre>' : '');
  }

  // ES modules cannot be loaded over file:// — say so plainly instead of
  // leaving a blank canvas. standalone.html works without a server.
  if (location.protocol === 'file:') {
    fail(
      'Браузер блокирует ES-модули на file://. Открой standalone.html ' +
      'или запусти локальный сервер: python3 -m http.server',
    );
  } else {
    try {
      const app = boot(canvas);
      splash.classList.add('hidden');
      canvas.focus();
      // Exposed for the headless smoke test; harmless in normal play.
      window.__DEEPSHADE__ = app;
    } catch (err) {
      fail('ошибка инициализации', err && err.stack ? err.stack : err);
      throw err;
    }
  }
</script>
</body>
</html>
